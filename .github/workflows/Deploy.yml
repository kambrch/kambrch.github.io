name: Build and Deploy
on:
  push:
    branches:
      - main
      - master
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        persist-credentials: false
    # NOTE: Python is necessary for the pre-rendering (minification) step
    - name: Install python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install python dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r requirements.txt
    # NOTE: Here you can install dependencies such as matplotlib if you use
    # packages such as PyPlot.
    # - run: pip install matplotlib
    - name: Install Julia
      uses: julia-actions/setup-julia@v2
      with:
        version: '1' # Latest stable Julia release.
    # Caches ~/.julia (packages + precompiled artifacts). Without it every
    # push pays a full precompilation of Franklin and its dependencies.
    - name: Cache Julia depot
      uses: julia-actions/cache@v2
    # Franklin's own incremental build cache: unchanged pages are not
    # re-rendered (and evaluated code blocks are not re-run).
    - name: Cache Franklin build
      uses: actions/cache@v4
      with:
        path: __cache
        key: franklin-cache-${{ github.sha }}
        restore-keys: |
          franklin-cache-
    # NOTE
    #   The steps below ensure that NodeJS and Franklin are loaded then it
    #   installs highlight.js which is needed for the prerendering step
    #   (code highlighting + katex prerendering).
    #   Then the environment is activated and instantiated to install all
    #   Julia packages which may be required to successfully build your site.
    #   The last line should be `optimize()` though you may want to give it
    #   specific arguments, see the documentation or ?optimize in the REPL.
    - name: Build
      run: julia --project=. -e '
            using Pkg; Pkg.instantiate();
            using NodeJS; run(`$(npm_cmd()) install highlight.js`);
            using Franklin;
            optimize(prerender=true)'
    - name: Normalize URLs
      run: ./scripts/normalize-generated-urls.sh __site
    - name: Deploy
      uses: JamesIves/github-pages-deploy-action@releases/v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        branch: gh-pages
        folder: __site
        # Force-push a single commit: gh-pages is fully regenerable from main,
        # and this keeps stale build artefacts out of its history for good.
        single-commit: true
